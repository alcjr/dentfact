{% extends "base.html" %}
{% load static %}
{% block title %} Facturas por dentista {% endblock %}

{% block stylesheets %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/perfect-scrollbar/1.5.5/css/perfect-scrollbar.min.css">
<link rel="stylesheet" href="{% static 'assets/css/dentfact.css' %}">
<link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/22.1.7/css/dx.light.css" />

<style>
  /* --- Cabecera fija --- */
  .Factura_Header {
      position: sticky;
      top: 70px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 15px;
      margin: 20px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      color: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  .Factura_Header h1 { margin: 0; font-size: 22px; font-weight: 600; }

  .content { padding: 15px 20px; background-color: inherit; }

  .grid-scroll {
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      overflow-x: hidden;
      background-color: white;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      padding: 10px;
  }

  #gridContainer { width: 100%; }

  html, body { height: 100%; overflow-y: hidden; }

  /* === MODAL DE DETALLE === */
  .dx-popup-content { overflow: hidden !important; }
  .detail-popup .dx-popup-content { padding: 0 !important; }

  #detailPopup .dx-popup-title {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      color: white !important;
      font-weight: 600 !important;
      font-size: 18px !important;
      line-height: 1.4 !important;
      padding: 16px 80px 16px 20px !important;
      border-radius: 8px 8px 0 0 !important;
      white-space: normal !important;
      word-wrap: break-word !important;
      min-height: 56px !important;
      height: auto !important;
      max-height: 120px !important;
      overflow: hidden !important;
      position: relative !important;
      box-sizing: border-box !important;
      display: flex !important;
      align-items: center !important;
      z-index: 1;
  }

  #detailPopup .dx-popup-title > .dx-popup-title-content {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100%;
      white-space: normal !important;
      word-wrap: break-word !important;
      line-height: 1.4 !important;
  }

  #detailPopup .dx-popup-title .dx-button {
      position: absolute !important;
      right: 12px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: rgba(255, 255, 255, 0.15) !important;
      border: none !important;
      border-radius: 50% !important;
      width: 36px !important;
      height: 36px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
  }

  #detailPopup .dx-popup-title .dx-button:hover {
      background: rgba(255, 255, 255, 0.3) !important;
      transform: translateY(-50%) scale(1.05);
  }

  #detailPopup .dx-popup-title .dx-button .dx-icon {
      color: white !important;
      font-size: 18px !important;
      font-weight: bold;
  }

  .detail-tab-panel { height: 520px !important; overflow: hidden; }
  .detail-tab-content {
      padding: 20px;
      background: #fdfdfd;
      height: calc(100% - 50px);
      overflow-y: auto;
      border-radius: 0 0 8px 8px;
      font-size: 14px;
  }

  .detail-row {
      display: flex;
      padding: 10px 0;
      border-bottom: 1px dashed #e8e8e8;
      align-items: flex-start;
  }

  .detail-row:last-child { border-bottom: none; }

  .detail-label {
      font-weight: 600;
      color: #444;
      width: 195px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
  }

  .detail-label i { color: #667eea; width: 18px; text-align: center; font-size: 15px; }

  .detail-value {
      color: #222;
      flex: 1;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
  }

  .detail-value.highlight {
      color: #667eea !important;
      font-weight: 700 !important;
      font-size: 1.05em;
  }

  .action-buttons-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
  }

  .dx-button .dx-icon.fa-eye { color: #667eea !important; }

  .detail-ellipsis {
      cursor: pointer;
      color: #667eea;
      font-size: 16px;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
  }

  .detail-ellipsis:hover {
      background-color: rgba(102, 126, 234, 0.1);
  }

  /* Texto truncado solo en celdas largas */
  .long-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
  }
</style>
{% endblock stylesheets %}

{% block content %}
<div class="Factura_Header">
    <h1>Facturas por dentista</h1>
</div>

<div class="content">
    <div class="grid-scroll">
        <div id="gridContainer"></div>
    </div>
</div>

<!-- MODAL DE DETALLE -->
<div id="detailPopup" class="detail-popup"></div>
{% endblock content %}

{% block javascripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/perfect-scrollbar@1.5.0/dist/perfect-scrollbar.min.js"></script>
<script src="{% static 'assets/js/atlantis.min.js' %}"></script>
<script src="https://cdn3.devexpress.com/jslib/22.1.7/js/dx.all.js"></script>

<script>
    DevExpress.localization.locale("es");

    $(function() {
        console.log("Inicializando DataGrid para facturas por dentista...");

        // CSRF seguro para POST
        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                    const csrftoken = getCookie('csrftoken');
                    if (csrftoken) xhr.setRequestHeader("X-CSRFToken", csrftoken);
                }
            }
        });

        function getCookie(name) {
            const cookies = document.cookie.split(';').map(c => c.trim());
            for (const cookie of cookies)
                if (cookie.startsWith(name + '=')) return decodeURIComponent(cookie.split('=')[1]);
            return null;
        }

        let detailPopup = null;

        function initDetailPopup() {
            if (detailPopup) return;

            detailPopup = $("#detailPopup").dxPopup({
                width: 960,
                height: 620,
                showTitle: true,
                title: "Detalles de Factura",
                dragEnabled: true,
                hideOnOutsideClick: true,
                shading: true,
                shadingColor: "rgba(0,0,0,0.4)",
                onShowing: function(e) {
                    const data = e.component.option("rowData");
                    if (!data) return;

                    e.component.option("title", `Factura ${data.FACTURA} – ${data.DOCTOR}`);

                    const content = $("<div>").addClass("detail-tab-panel");
                    const tabPanel = $("<div>").dxTabPanel({
                        height: "100%",
                        items: [
                            { title: "Datos", icon: "info", template: () => createTabDatos(data) },
                            { title: "Sociedad", icon: "building", template: () => createTabSociedad(data) },
                            { title: "Liquidación", icon: "calculator", template: () => createTabLiquidacion(data) }
                        ],
                        itemTemplate: (itemData, itemIndex, element) => {
                            element.append(`<i class="dx-icon dx-icon-${itemData.icon}"></i> <span>${itemData.title}</span>`);
                        }
                    });
                    content.append(tabPanel);
                    e.component.content().empty().append(content);
                },
                onContentReady: function(e) {
                    const title = e.component.$element().find(".dx-popup-title");
                    title.find(".custom-close-btn").remove();
                    const closeBtn = $("<div>")
                        .addClass("dx-button custom-close-btn")
                        .css({
                            position: "absolute", right: "12px", top: "50%", transform: "translateY(-50%)",
                            width: "36px", height: "36px", display: "flex", alignItems: "center",
                            justifyContent: "center", background: "rgba(255,255,255,0.15)",
                            borderRadius: "50%", cursor: "pointer"
                        })
                        .append('<i class="dx-icon dx-icon-close" style="color:white;font-size:18px;"></i>')
                        .on("click", () => e.component.hide());
                    title.append(closeBtn);
                }
            }).dxPopup("instance");
        }

        function createDetailRow(label, value, icon = "circle", highlight = false) {
            if (value == null || value === "") return "";
            const val = String(value).replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const cls = highlight ? ' class="detail-value highlight"' : ' class="detail-value"';
            return `<div class="detail-row">
                <div class="detail-label"><i class="fas fa-${icon}"></i> ${label}:</div>
                <div${cls}>${val}</div>
            </div>`;
        }

        function createTabDatos(data) {
            const div = $("<div>").addClass("detail-tab-content");
            let html = "";
            html += createDetailRow("Factura", data.FACTURA, "hashtag");
            html += createDetailRow("Doctor", data.DOCTOR, "user-md");
            html += createDetailRow("Período", `${data.L_DESDE} - ${data.L_HASTA}`, "calendar-alt");
            html += createDetailRow("Mes/Año", `${data.MES}/${data.ANNO}`, "calendar");
            html += createDetailRow("Emisión", data.EMISION, "paper-plane");
            html += createDetailRow("Estado", data.ESTADO, "info-circle");
            html += createDetailRow("DNI", data.DNI, "id-card");
            html += createDetailRow("Colegiado", data.COLEGIADO, "id-badge");
            html += createDetailRow("Email", data.EMAIL, "envelope");
            html += createDetailRow("Teléfono", data.TELEFONO, "phone");
            div.html(html);
            return div;
        }

        function createTabSociedad(data) {
            const div = $("<div>").addClass("detail-tab-content");
            let html = "";
            html += createDetailRow("CIF", data.CIF, "barcode");
            html += createDetailRow("Descripción", data.DESCRIPCION_SOC, "file-alt");
            html += createDetailRow("Dirección", data.DIRECCION_SOC, "map-marker-alt");
            html += createDetailRow("Código Postal", data.POSTAL_SOC, "envelope");
            html += createDetailRow("Representante", data.REPRESENTANTE, "user-tie");
            div.html(html);
            return div;
        }

        function createTabLiquidacion(data) {
            const div = $("<div>").addClass("detail-tab-content");
            let html = "";
            html += createDetailRow("Cálculo", data.CALCULO_TOTAL, "calculator", true);
            html += createDetailRow("Gastos", data.GASTOS, "minus-circle");
            html += createDetailRow("Base", data.BASE_FACTURA, "euro-sign");
            html += createDetailRow("Cuota IRPF", data.CUOTA_IRPF, "percent");
            html += createDetailRow("Total", data.TOTAL_FACTURA, "check-circle", true);
            div.html(html);
            return div;
        }

        const euroFormat = { type: "fixedPoint", precision: 2, thousandsSeparator: ".", decimalSeparator: "," };

        const grid = $("#gridContainer").dxDataGrid({
            dataSource: new DevExpress.data.CustomStore({
                key: "FACTURA",
                load: function() {
                    return $.ajax({
                        url: "/home/api/factura_d/",
                        method: "GET",
                        dataType: "json"
                    }).then(data => ({
                        data: data,
                        totalCount: data.length
                    })).catch(error => {
                        console.error("Error al cargar datos:", error);
                        DevExpress.ui.notify("No se pudieron cargar los datos.", "error", 3000);
                        return { data: [], totalCount: 0 };
                    });
                }
            }),

            selection: { mode: "multiple", showCheckBoxesMode: "always" },
            allowColumnReordering: true,
            showBorders: true,
            rowAlternationEnabled: true,
            columnAutoWidth: false,
            columnHidingEnabled: true,
            allowColumnResizing: true,
            columnResizingMode: "widget",

            grouping: { autoExpandAll: false, contextMenuEnabled: true, allowCollapsing: true },
            groupPanel: { visible: true, emptyPanelText: "Arrastre aquí una columna para agrupar", height: 40 },

            paging: { pageSize: 50 },
            pager: { showPageSizeSelector: true, allowedPageSizes: [10, 25, 50, 100], showInfo: true, showNavigationButtons: true },

            searchPanel: { visible: true, width: 240, placeholder: "Buscar...", highlightSearchText: true },
            filterRow: { visible: true, applyFilter: "auto" },
            headerFilter: { visible: true },

            columns: [
                { dataField: 'FACTURA', caption: "Factura", fixed: true, width: 120 },
                { dataField: 'L_DESDE', caption: "Desde", dataType: "date", format: "dd/MM/yyyy", fixed: true, width: 100 },
                { dataField: 'L_HASTA', caption: "Hasta", dataType: "date", format: "dd/MM/yyyy", width: 100 },
                { dataField: 'MES', caption: "Mes", width: 80 },
                { dataField: 'ANNO', caption: "Año", width: 80 },
                { dataField: 'EMISION', caption: "Emisión", width: 100 },
                { dataField: 'CALCULO_TOTAL', caption: "Cálculo Total", dataType: "number", format: euroFormat, width: 130 },
                { dataField: 'GASTOS', caption: "Gastos", dataType: "number", format: euroFormat, width: 120 },
                { dataField: 'BASE_FACTURA', caption: "Base", dataType: "number", format: euroFormat, width: 120 },
                { dataField: 'IRPF', caption: "IRPF", dataType: "number", format: euroFormat, width: 100 },
                { dataField: 'CUOTA_IRPF', caption: "Cuota IRPF", dataType: "number", format: euroFormat, width: 120 },
                { dataField: 'TOTAL_FACTURA', caption: "Total", dataType: "number", format: euroFormat, width: 120 },
                { dataField: 'SPCODE', caption: "SPCODE", width: 100 },
                { dataField: 'DOCTOR', caption: "Doctor", width: 180, cellTemplate: (c, o) => c.append($("<div>").addClass("long-text").text(o.value)) },
                { dataField: 'DNI', caption: "DNI", width: 110 },
                { dataField: 'COLEGIADO', caption: "Colegiado", width: 120 },
                { dataField: 'EMAIL', caption: "Email", width: 200, cellTemplate: (c, o) => c.append($("<div>").addClass("long-text").text(o.value)) },
                { dataField: 'TELEFONO', caption: "Teléfono", width: 120 },
                { dataField: 'DIRECCION', caption: "Dirección", width: 250, cellTemplate: (c, o) => c.append($("<div>").addClass("long-text").text(o.value)) },
                { dataField: 'CUENTA', caption: "Cuenta", width: 200 },
                { dataField: 'ESTADO', caption: "Estado", width: 100 },
                { dataField: 'CIF', caption: "CIF", width: 120 },
                { dataField: 'DESCRIPCION_SOC', caption: "Descripción", width: 250, cellTemplate: (c, o) => c.append($("<div>").addClass("long-text").text(o.value)) },
                { dataField: 'DIRECCION_SOC', caption: "Domicilio", width: 250, cellTemplate: (c, o) => c.append($("<div>").addClass("long-text").text(o.value)) },
                { dataField: 'CIUDAD', caption: "Ciudad", width: 150 },
                { dataField: 'POSTAL_SOC', caption: "Postal", width: 100 },
                { dataField: 'REPRESENTANTE', caption: "Representante", width: 150 },
                { dataField: 'NIF_REP', caption: "NIF Rep.", width: 120 },

                {
                    type: "buttons",
                    width: 110,
                    fixed: true,
                    fixedPosition: "right",
                    cellTemplate: function(container, options) {
                        const data = options.data;
                        const wrapper = $('<div>').addClass('action-buttons-container');

                        $('<div>').dxButton({
                            icon: "fa fa-eye",
                            hint: "Ver factura",
                            onClick: () => {
                                if (data?.FACTURA) {
                                    window.location.href = "{% url 'home:factura_ou_prn' pk='__FACTURA__' %}".replace('__FACTURA__', data.FACTURA);
                                } else {
                                    DevExpress.ui.notify("Factura no encontrada.", "warning", 3000);
                                }
                            }
                        }).appendTo(wrapper);

                        $('<div>').addClass("detail-ellipsis")
                            .attr("title", "Ver detalles")
                            .html('<i class="fas fa-ellipsis-h"></i>')
                            .on("click", () => {
                                initDetailPopup();
                                detailPopup.option("rowData", data);
                                detailPopup.show();
                            })
                            .appendTo(wrapper);

                        container.append(wrapper);
                    }
                }
            ],

            summary: {
                groupItems: [
                    { column: "BASE_FACTURA", summaryType: "sum", valueFormat: euroFormat, displayFormat: "Total: {0} €" },
                    { column: "GASTOS", summaryType: "sum", valueFormat: euroFormat, displayFormat: "Total: {0} €" },
                    { column: "TOTAL_FACTURA", summaryType: "sum", valueFormat: euroFormat, displayFormat: "Total: {0} €" }
                ],
                totalItems: [
                    { column: "BASE_FACTURA", summaryType: "sum", valueFormat: euroFormat, displayFormat: "Total General: {0} €" },
                    { column: "GASTOS", summaryType: "sum", valueFormat: euroFormat, displayFormat: "Total General: {0} €" },
                    { column: "TOTAL_FACTURA", summaryType: "sum", valueFormat: euroFormat, displayFormat: "Total General: {0} €" }
                ]
            },

            toolbar: {
                items: [
                    "groupPanel", "searchPanel",
                    { name: "exportButton", location: "after", widget: "dxButton", options: { icon: "exportxlsx", text: "Exportar a Excel", onClick: () => grid.exportToExcel() } },
                    { location: "after", widget: "dxButton", options: { icon: "fa fa-file-code", text: "Exportar AEAT XML", onClick: () => export2xml(grid) } },
                    { location: "after", widget: "dxButton", options: { icon: "expand", text: "Expandir", onClick: () => grid.expandAll(-1) } },
                    { location: "after", widget: "dxButton", options: { icon: "collapse", text: "Colapsar", onClick: () => grid.collapseAll(-1) } },
                    "columnChooserButton"
                ]
            },

            export: { enabled: true, fileName: "Facturas_por_dentista" },

            onCellPrepared: function(e) {
                if (e.rowType === "data" && ["DOCTOR", "EMAIL", "DIRECCION", "DESCRIPCION_SOC", "DIRECCION_SOC"].includes(e.column.dataField)) {
                    $(e.cellElement).addClass("long-text");
                }
            }
        }).dxDataGrid("instance");

        // Inicializar una sola vez
        initDetailPopup();
    });

    // === EXPORTACIÓN BATCH XML ===
    function export2xml(grid) {
    const selected = grid.getSelectedRowKeys();
    if (!selected || selected.length === 0) {
        DevExpress.ui.notify("Selecciona al menos una factura.", "warning", 3000);
        return;
    }

    $.ajax({
        url: "{% url 'home:export2xml' %}",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ facturas: selected }),
        success: function(data) {
            if (data.success) {
                DevExpress.ui.notify(data.mensaje, "success", 5000);
                if (confirm(`Archivo creado: ${data.nombre}\n¿Abrir carpeta c:\\data\\aeat?`)) {
                    window.open("file:///c:/data/aeat", "_blank");
                }
            } else {
                const err = data.error || "Error desconocido";
                const det = data.errores ? "\n• " + data.errores.join("\n• ") : "";
                DevExpress.ui.notify(err + det, "error", 8000);
            }
        },
        error: function(xhr) {
            let msg = "Error de conexión.";
            try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
            DevExpress.ui.notify(msg, "error", 5000);
        }
    });
}
</script>
{% endblock javascripts %}
